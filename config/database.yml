default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: rails_todo_app_development

test:
  <<: *default
  database: rails_todo_app_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  cable:
    <<: *primary_production

  cache:
    <<: *primary_production

  queue:
    <<: *primary_production